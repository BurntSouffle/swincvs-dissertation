# Run B: RGB + GT Masks
# Projection (5ch->3ch) + Frozen SwinV2 backbone + Trainable LSTM head

experiment_name: 'run_b_rgb_masks'
seed: 42

# Data
dataset_dir: 'C:\Users\sufia\Documents\Uni\Masters\DISSERTATION\endoscapes'
use_masks: true  # RGB + Gallbladder mask + Tool mask

# Model
checkpoint_path: 'C:\Users\sufia\Documents\Uni\Masters\DISSERTATION\SwinCVS\weights\SwinCVS_E2E_MC_IMNP_sd5_bestMAP.pt'
lstm_hidden: 256
lstm_layers: 2
dropout: 0.3

# Training
epochs: 30
batch_size: 8
learning_rate: 0.001  # Higher LR since only training head + projection
weight_decay: 0.0001
patience: 7  # Early stopping patience

# Class weights (same as Run A for fair comparison)
class_weights: [4.7, 6.5, 3.7]

num_workers: 0  # Set to 0 for Windows compatibility
