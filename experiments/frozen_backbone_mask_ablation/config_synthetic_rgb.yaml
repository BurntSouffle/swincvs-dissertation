# Experiment 2A: RGB Only with Synthetic Mask Dataset (1,933 frames)
# Frozen SwinV2 backbone + Trainable LSTM head
# Baseline for comparison with synthetic masks

experiment_name: 'exp2a_synthetic_rgb_only'
seed: 42

# Data
dataset_dir: 'C:\Users\sufia\Documents\Uni\Masters\DISSERTATION\endoscapes'
