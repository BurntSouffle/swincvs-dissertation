# Experiment 2B: RGB + Synthetic Masks (1,933 frames)
# Projection (5ch->3ch) + Frozen SwinV2 backbone + Trainable LSTM head

experiment_name: 'exp2b_synthetic_rgb_masks'
seed: 42

# Data
dataset_dir: 'C:\Users\sufia\Documents\Uni\Masters\DISSERTATION\endoscapes'
dataset_type: 'synthetic'  # Use synthetic mask dataset
use_masks: true  # RGB + Gallbladder mask + Tool mask

# Model
checkpoint_path: 'C:\Users\sufia\Documents\Uni\Masters\DISSERTATION\SwinCVS\weights\SwinCVS_E2E_MC_IMNP_sd5_bestMAP.pt'
lstm_hidden: 256
lstm_layers: 2
dropout: 0.3

# Training
epochs: 30
batch_size: 8
learning_rate: 0.001
weight_decay: 0.0001
patience: 7

# Class weights (same as RGB baseline for fair comparison)
class_weights: [3.0, 4.0, 2.5]

num_workers: 0
