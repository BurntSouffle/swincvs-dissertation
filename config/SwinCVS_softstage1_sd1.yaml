# SOFT-LABEL STAGE 1 — per-frame SwinV2 backbone classifier trained with soft
# annotator-agreement labels. This produces a *better representation to freeze*:
# the output checkpoint becomes BACKBONE.PRETRAINED for a frozen Stage-2 run
# (SwinCVS_frozen_*.yaml), giving the two-stage soft-label path:
#     soft Stage-1 (this) -> freeze -> Stage-2 temporal.
#
# Differs from the locked recipe in the flags that select the bare-backbone path:
#   MODEL.LSTM            : True -> False   (f_build.py:52-54 returns a bare SwinV2
#                                            with a 3-class head; f_dataset.py:48-51
#                                            switches to single-frame Endoscapes_Dataset)
#   MODEL.MULTICLASSIFIER : True -> False   (no LSTM => no mid-stream head)
#   TRAIN.SOFT_TRAIN_LABELS: (absent) -> True  (train C1/C2/C3 = mean annotator
#                                            agreement in {0,1/3,2/3,1}; applied in
#                                            get_dataframe upstream of the LSTM/single-
#                                            frame split, so it reaches the single-frame
#                                            dataset unchanged)
# E2E is left True (semantically "backbone not frozen"); it has no effect on the
# bare-backbone path (the freeze branch only runs inside `if MODEL.LSTM`).
#
# Auto-generated experiment name (f_environment.py:123-125,138-140,150-152):
#   SwinV2_backbone_IMNP_F1a_sd1  -> saved weight ..._bestMAP.pt
# Feed that file to SwinCVS_frozen_*.yaml's BACKBONE.PRETRAINED for Stage-2.
#
# CAVEAT: the ORIGINAL Stage-1 recipe that produced Swin_backbone_no_augm_sd4 is
# undocumented. This config uses the locked-recipe ENCODER_LR (1e-5) for the
# bare-backbone optimizer group (f_training_utils.py:102-103). If the original
# backbone was trained at a higher LR, the hard-label control Stage-1 here may
# not exactly reproduce no_augm_sd4 — train a HARD-label Stage-1 control under
# THIS config alongside the soft one so the comparison is apples-to-apples.
#
# Seeds 2/3 via launch_softstage1_seed.sh overriding SEED.

# GENERAL PARAMS
EXPERIMENT_NAME: 'SwinCVS_softstage1_sd1'
SEED: 1
DATASET_DIR: '/workspace'

# SWINCVS MODEL PARAMS
MODEL:
  LSTM: False            # <-- bare SwinV2 per-frame classifier (Stage 1)
  LSTM_PARAMS:
    NUM_LAYERS: 2
    HIDDEN_SIZE: 256
  E2E: True              # no effect on the bare-backbone path
  MULTICLASSIFIER: False # <-- no LSTM => no mid-stream head
  INFERENCE: False
  INFERENCE_WEIGHTS: 'SwinV2LSTM_e2e_raw_mc_V3_sd5_bestMAP.pt'

# TRAINING PARAMS
TRAIN:
  EPOCHS: 8
  LIMIT_DATA_FRACTION: 1
  TRANSFORMS:
    ENDOSCAPES_MEAN: [0.485, 0.456, 0.406]
    ENDOSCAPES_STD: [0.229, 0.224, 0.225]
    CENTER_CROP: 480
  BATCH_SIZE: 4
  OPTIMIZER:
    NAME: 'adamw'
    EPS: 1.0e-08
    BETAS: [0.9, 0.999]
    WEIGHT_DECAY: 0.02
    ENCODER_LR: 0.00001   # bare-backbone group LR (see CAVEAT above)
    CLASSIFIER_LR: 0.001
  CLASS_WEIGHTS: [3.19852941, 4.46153846, 2.79518072]
  WARMUP_EPOCHS: 4
  WARMUP_LR: 0.001
  BASE_LR: 0.001
  MIN_LR: 0.0000001
  MULTICLASSIFIER_ALPHA: 0.8
  SAVE_WEIGHTS: True
  CHECKPOINT_PATH: null
  LR_SCHEDULER:
    NAME: 'cosine'
    WARMUP_PREFIX: False
  CLIP_GRAD: 5
  ACCUMULATION_STEPS: 1
  # ---- soft annotator-agreement training labels (same flag as F1a) ----
  SOFT_TRAIN_LABELS: True

# SWINV2 BACKBONE PARAMS
BACKBONE:
  PRETRAINED: 'swinv2_base_patch4_window12to24_192to384_22kto1k_ft.pth'
  DROP_PATH_RATE: 0.2
  DROP_RATE: 0.0
  NUM_CLASSES: 1000
  SWINV2:
    PATCH_SIZE: 4
    IN_CHANS: 3
    EMBED_DIM: 128
    DEPTHS: [ 2, 2, 18, 2 ]
    NUM_HEADS: [ 4, 8, 16, 32 ]
    WINDOW_SIZE: 24
    PRETRAINED_WINDOW_SIZES: [ 12, 12, 12, 6 ]
    MLP_RATIO: 4
    QKV_BIAS: True
    APE: False
    PATCH_NORM: True
  USE_CHECKPOINT: False
