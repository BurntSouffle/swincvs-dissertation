# FROZEN SwinCVS — the paper's frozen-backbone recipe, reproduced in OUR harness.
# Identical to SwinCVS_baseline_sd1.yaml EXCEPT the three flags that switch the
# pipeline from end-to-end to frozen-backbone training:
#   MODEL.E2E            : True  -> False   (f_build.py:45-48 freezes the WHOLE
#                                            SwinV2 backbone; only LSTM + fc_lstm train)
#   MODEL.MULTICLASSIFIER: True  -> False   (forced off when E2E=False; no fc_swin head)
#   BACKBONE.PRETRAINED  : ImageNet -> Swin_backbone_no_augm_sd4_bestMAP.pt
#                                            (f_build.py:31-36 loads it as the endoscapes
#                                            Stage-1 backbone, reshaping head to (1024,3))
#
# Auto-generated experiment name (f_environment.py:120-122,141-143):
#   SwinCVS_frozen_ENDP_sd1   -> saved weight SwinCVS_frozen_ENDP_sd1_bestMAP.pt
#
# Everything else mirrors the locked recipe. The dead config keys
# (LR_SCHEDULER, WARMUP_*, BASE_LR, MIN_LR) are LEFT IN PLACE only because
# SwinCVS.py ignores them; do not enable them. The ENCODER_LR group is inert
# under freezing (backbone params have requires_grad=False -> no gradient).
#
# Seeds 2 and 3 are produced by launch_frozen_seed.sh overriding SEED at runtime
# against this template (same pattern as the baseline launcher).

# GENERAL PARAMS
EXPERIMENT_NAME: 'SwinCVS_frozen_sd1'
SEED: 1
DATASET_DIR: '/workspace'

# SWINCVS MODEL PARAMS
MODEL:
  LSTM: True
  LSTM_PARAMS:
    NUM_LAYERS: 2
    HIDDEN_SIZE: 256
  E2E: False            # <-- freezes the SwinV2 backbone
  MULTICLASSIFIER: False # <-- no mid-stream fc_swin head when frozen
  INFERENCE: False
  INFERENCE_WEIGHTS: 'SwinV2LSTM_e2e_raw_mc_V3_sd5_bestMAP.pt'

# TRAINING PARAMS
TRAIN:
  EPOCHS: 8
  LIMIT_DATA_FRACTION: 1
  TRANSFORMS:
    ENDOSCAPES_MEAN: [0.485, 0.456, 0.406]
    ENDOSCAPES_STD: [0.229, 0.224, 0.225]
    CENTER_CROP: 480
  BATCH_SIZE: 4
  OPTIMIZER:
    NAME: 'adamw'
    EPS: 1.0e-08
    BETAS: [0.9, 0.999]
    WEIGHT_DECAY: 0.02
    ENCODER_LR: 0.00001    # inert under freezing; kept for recipe parity
    CLASSIFIER_LR: 0.001
  CLASS_WEIGHTS: [3.19852941, 4.46153846, 2.79518072]
  WARMUP_EPOCHS: 4
  WARMUP_LR: 0.001
  BASE_LR: 0.001
  MIN_LR: 0.0000001
  MULTICLASSIFIER_ALPHA: 0.8
  SAVE_WEIGHTS: True
  CHECKPOINT_PATH: null
  LR_SCHEDULER:
    NAME: 'cosine'
    WARMUP_PREFIX: False
  CLIP_GRAD: 5
  ACCUMULATION_STEPS: 1

# SWINV2 BACKBONE PARAMS
BACKBONE:
  PRETRAINED: 'Swin_backbone_no_augm_sd4_bestMAP.pt'  # <-- Stage-1 endoscapes backbone
  DROP_PATH_RATE: 0.2
  DROP_RATE: 0.0
  NUM_CLASSES: 1000
  SWINV2:
    PATCH_SIZE: 4
    IN_CHANS: 3
    EMBED_DIM: 128
    DEPTHS: [ 2, 2, 18, 2 ]
    NUM_HEADS: [ 4, 8, 16, 32 ]
    WINDOW_SIZE: 24
    PRETRAINED_WINDOW_SIZES: [ 12, 12, 12, 6 ]
    MLP_RATIO: 4
    QKV_BIAS: True
    APE: False
    PATCH_NORM: True
  USE_CHECKPOINT: False
